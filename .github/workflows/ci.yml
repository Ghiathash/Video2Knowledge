name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create deterministic test media
        run: >-
          ffmpeg -f lavfi -i testsrc=size=320x180:rate=10
          -f lavfi -i sine=frequency=1000:sample_rate=16000
          -t 30 -c:v libx264 -pix_fmt yuv420p -c:a aac
          data/input/test.mp4
      - name: Compile
        run: python -m compileall -q src ui main.py
      - name: Test
        run: pytest -q
      - name: CLI help
        run: python main.py --help
      - name: Import application modules
        run: python -c "import ui.streamlit_app; import src.application.service; import src.providers.factory"
      - name: Validate Compose
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config
      - name: Build CPU image
        run: docker build -t video2knowledge .
